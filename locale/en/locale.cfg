[mod-setting-description]
sefs-enable-inventory=Give the player a starting set of buildings and equipment on first join.
sefs-enable-radar-scan=Reveal the map around the spawn point when a player first joins.
sefs-enable-bots=Equip the player with power armor, personal roboports, exoskeletons, and construction bots.

sefs-radar-radius=Radius in tiles to reveal around spawn. Default is 448 (roughly 2x the default radar scan diameter).

sefs-count-fast-belt=Number of red transport belts to give.
sefs-count-fast-underground=Number of red underground belt pieces to give.
sefs-count-fast-splitter=Number of red splitters to give.

sefs-count-pipe=Number of pipes to give.
sefs-count-pipe-underground=Number of underground pipe segments to give.

sefs-count-medium-pole=Number of medium electric poles to give.
sefs-count-boiler=Number of boilers to give.
sefs-count-steam-turbine=Number of steam turbines to give.
sefs-count-offshore-pump=Number of offshore pumps to give.

sefs-count-electric-miner=Number of electric mining drills to give.
sefs-count-stone-furnace=Number of stone furnaces to give.

sefs-count-assembler=Number of blue assembling machines to give.
sefs-count-fast-inserter=Number of fast inserters to give.
sefs-count-lab=Number of electric labs to give. Avoids the need for burner labs and the coal micromanagement that comes with them.

sefs-armor-tier=Choose power-armor (mk1, default) for vanilla compatibility — fits a fission reactor, 1 roboport, and 1 exoskeleton comfortably. Switch to power-armor-mk2 for Space Exploration runs where mk2 is available earlier and the larger grid fits more equipment.
sefs-count-construction-bot=Number of construction robots to give.
sefs-count-roboport=Number of personal roboport equipment modules to place in armor grid.
sefs-count-exoskeleton=Number of exoskeleton equipment modules to place in armor grid.
